name: Local catalog verification
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright-core install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: offline-lookup-evidence
          path: test-results/offline-lookup.png
